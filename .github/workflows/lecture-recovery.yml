name: Lecture recovery checks
on:
  push:
    branches: [fix/long-lecture-recovery, feature/local-model-choice]
  pull_request:
    paths:
      - 'public/**'
      - 'local/**'
      - 'scripts/**'
      - 'test/**'
      - 'server.mjs'
      - '.github/workflows/lecture-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m pip install numpy huggingface_hub playwright openpyxl
      - run: npm test
      - run: python -m unittest discover -s test -p 'qwen_test.py'
      - run: python -m unittest discover -s test -p 'qwen_decode_test.py'
      - run: python -m unittest discover -s test -p 'worker_test.py'
      - run: python -m unittest discover -s test -p 'setup_whisper_test.py'
      - run: python -m playwright install --with-deps chromium webkit
      - name: Browser capture, silence summaries, and disk recovery
        env:
          PORT: '3010'
          LECTURE_DATA_DIR: /tmp/lecture-recovery-records
        run: |
          node server.mjs > /tmp/lecture-recovery-server.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/ > /dev/null; then break; fi
            sleep 1
          done
          python test/browser_follow.py http://127.0.0.1:3010
          python test/browser_recovery.py http://127.0.0.1:3010
          python test/browser_silence.py http://127.0.0.1:3010
          python test/browser_whisper_notes.py http://127.0.0.1:3010
          python test/browser_models.py http://127.0.0.1:3010
          python test/browser_schedule.py http://127.0.0.1:3010
          python test/browser_blocks.py http://127.0.0.1:3010
          python test/browser_library.py
